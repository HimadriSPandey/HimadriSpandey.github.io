- id: cost-aware-trees
  title: |
    Optimal Logistic Regression Trees for Cost-Aware Diagnosis
  year: 2026
  status: working
  authors:
    - Himadri S. Pandey
    - Gian-Gabriel P. Garcia
  venue: In preparation
  abstract: |
    Jointly chooses how to group patients, which tests each group receives, and how each group's
    results determine a diagnosis, solved exactly by dynamic programming. Preliminary concussion
    results identify athletes with chronic medical conditions as a distinct group with its own
    diagnostic model.

