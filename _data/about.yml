# About page content (shown on /)
# Keep the main text to roughly 300-400 words. Project detail belongs on /research/,
# the full record in the CV.

content: |
  I am a Machine Learning PhD Candidate at Georgia Tech's
  [H. Milton Stewart School of Industrial and Systems Engineering](https://www.isye.gatech.edu/),
  advised by [Dr. Gian-Gabriel Garcia](https://giangabrielgarcia.com/).
  **I am on the 2026&ndash;27 academic job market.**

  I study how healthcare organizations should decide who receives help, what kind of help, and
  when, if there is not enough to go around. My work combines machine learning, optimization, and
  sequential decision-making to allocate clinical attention and to design diagnostic assessments.

  I build this work with clinicians at [Children's Healthcare of Atlanta](https://www.choa.org/)
  and researchers in the NCAA&ndash;DoD CARE Consortium. Before my PhD, I spent three years as an
  Applied Scientist at [Lucas Systems](https://www.lucasware.com/) (2019&ndash;2022), and in 2025 I
  was an Applied Scientist Intern at [AWS](https://aws.amazon.com/).

  My work on [graduate-student mental health](/service/) informs my interest in improving access
  to care beyond the university.

