# Your bio/about content (supports Markdown)
content: |
  I am a **PhD Candidate** at **Georgia Tech** in the
  [H. Milton Stewart School of Industrial and Systems Engineering](https://www.isye.gatech.edu/),
  advised by **[Dr. Gian-Gabriel Garcia](https://giangabrielgarcia.com/)**. I study how organizations
  should allocate **scarce resources** (clinician attention, diagnostic time, monitoring capacity)
  when decisions are made repeatedly, under uncertainty, and with imperfect data. My work sits in
  **healthcare operations** and **data-driven decision-making**: I combine optimization and
  sequential decision models with machine learning that is trained for the decision it supports,
  not only for prediction accuracy.

  My research is built with practitioners. With **[Children's Healthcare of Atlanta](https://www.choa.org/)**,
  I study how hospital wards should decide which deteriorating children receive closer
  monitoring, specialist assessment, or ICU transfer when staff and beds are limited
  ([research](/research/)). With the **NCAA&ndash;DoD CARE Consortium**, I design concussion
  assessments that fit the time clinicians actually have.

  **I am on the 2026&ndash;27 academic job market.**

  <hr class="bio-separator">

  Before my PhD, I spent three years as an **Applied Scientist** at
  [Lucas Systems](https://www.lucasware.com/) (2019&ndash;2022) building optimization and ML
  tools for warehouse operations, and in 2025 I was an **Applied Scientist Intern** at
  [AWS](https://aws.amazon.com/). I received my B.S. in Computer Science (minors in Mathematics
  and Physics) from the **University of Cincinnati** in 2019.

  <hr class="bio-separator">

