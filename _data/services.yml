- title: "Leadership and Well-Being"
  intro: |
    Mental health and community well-being deeply matter to me, and I have worked on them at every
    level I could reach at Georgia Tech: from supporting fellow graduate students personally in my
    own school, to campus-wide student government, to the counseling center, to the university's
    administration. This work also shapes my research interest in improving access to care beyond
    the university. ISyE recognized this work with the Philip J. and Delores A. Scott Graduate
    Student Health and Wellness Award in 2024, 2025, and 2026.
  items:
    - date: "2023 – present"
      text: "Bee Well Ambassador, H. Milton Stewart School of ISyE"
      detail: "Support fellow graduate students by organizing events, communicating resources, and showing up during times of crisis."
    - date: "2023 – 2025"
      text: "Mental Health & Well-Being Committee, Graduate Student Government Association, Georgia Tech"
      detail: "Promoted mental health and well-being initiatives for graduate students at Georgia Tech."
    - date: "2023 – 2024"
      text: "Member, [Mental Health Joint Allocation Committee](https://www.sga.gatech.edu/jac/), Georgia Tech"
      detail: "Funds programs, services, and initiatives that support student mental health at Georgia Tech."
    - date: "Summer 2024"
      text: "Data analysis project, [Center for Mental Health Care & Resources](https://mentalhealth.gatech.edu/), Georgia Tech"
      detail: "Analyzed counseling-center appointment data to understand how quickly students reach care, which resources they seek, and where they disengage."
    - date: "2024 – 2025"
      text: "Graduate Student Representative, [Emerging Leaders Advisory Board](https://students.gatech.edu/emerging-leaders), Georgia Tech"
      detail: "Represented graduate students in monthly meetings with Georgia Tech administrators."

