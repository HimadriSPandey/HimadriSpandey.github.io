<div id="impact" class="impact">
    <h2 class="impact-title">Practice &amp; Industry</h2>
    <div class="impact-grid">
        {% for i in site.data.impact %}
        <div class="impact-card">
            <div class="impact-head">
                <i class="{{ i.icon }} impact-icon"></i>
                <div>
                    <p class="impact-org">{{ i.org }}</p>
                    <p class="impact-role">{{ i.role }}{% if i.years %} &middot; {{ i.years }}{% endif %}</p>
                </div>
            </div>
            <ul class="impact-points">
                {% for pt in i.points %}<li>{{ pt | markdownify | remove: '<p>' | remove: '</p>' | strip }}</li>{% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</div>
